# Official GitLab chart 10.x. Dependencies run locally in the gitlab namespace.
global:
  edition: ce
  hosts:
    domain: iot.local
    https: false
    gitlab:
      name: gitlab.iot.local
  gatewayApi:
    enabled: false
    installEnvoy: false
  ingress:
    enabled: false
    configureCertmanager: false
    tls:
      enabled: false
  psql:
    host: postgresql.gitlab.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-local-credentials
      key: postgres-password
  redis:
    host: redis.gitlab.svc.cluster.local
    auth:
      enabled: false
  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection
    backups:
      bucket: gitlab-backups
      tmpBucket: tmp
  kas:
    enabled: false
installCertmanager: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
registry:
  enabled: false
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    workerProcesses: 2
    resources:
      requests:
        cpu: 300m
        memory: 1500Mi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  gitaly:
    persistence:
      size: 10Gi
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-object-storage
          key: config
