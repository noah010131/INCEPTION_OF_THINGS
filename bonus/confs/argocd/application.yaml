apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    # Cluster DNS works from Argo CD without modifying CoreDNS or /etc/hosts.
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/iot/playground.git
    targetRevision: main
    path: bonus/confs/app
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
